<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反向木鱼 - 电子积德</title>
    <style>
        /* ===== 全局重置与基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8d5b7;
            overflow-x: hidden;
        }

        /* ===== 页面标题区域 ===== */
        .header {
            text-align: center;
            padding: 24px 16px 16px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #d4a853;
            text-shadow: 0 0 20px rgba(212, 168, 83, 0.3);
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: #8b7355;
        }

        /* ===== 添加制裁对象区域 ===== */
        .add-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 16px 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .add-section input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #3d3d5c;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #e8d5b7;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .add-section input::placeholder {
            color: #5a5a7a;
        }

        .add-section input:focus {
            border-color: #d4a853;
            box-shadow: 0 0 10px rgba(212, 168, 83, 0.2);
        }

        .add-section button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #d4a853, #b8860b);
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .add-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 168, 83, 0.4);
        }

        .add-section button:active {
            transform: translateY(0);
        }

        /* ===== 制裁对象列表 ===== */
        .target-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 0 16px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .target-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #3d3d5c;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .target-card:hover {
            border-color: #d4a853;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 168, 83, 0.15);
        }

        .target-card.active {
            border-color: #d4a853;
            background: rgba(212, 168, 83, 0.1);
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.2);
        }

        .target-card .target-name {
            font-size: 1rem;
            font-weight: bold;
            color: #e8d5b7;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .target-card .karma-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d4a853;
            transition: transform 0.15s ease;
        }

        .target-card .karma-label {
            font-size: 0.7rem;
            color: #8b7355;
            margin-top: 2px;
        }

        /* 数字跳动动画 */
        .target-card .karma-value.pop {
            animation: numberPop 0.3s ease;
        }

        @keyframes numberPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* 删除按钮 */
        .target-card .delete-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: #5a5a7a;
            font-size: 1rem;
            cursor: pointer;
            line-height: 20px;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }

        .target-card:hover .delete-btn {
            opacity: 1;
        }

        .target-card .delete-btn:hover {
            color: #e74c3c;
        }

        /* 空列表提示 */
        .empty-tip {
            text-align: center;
            color: #5a5a7a;
            padding: 30px 16px;
            font-size: 0.9rem;
        }

        /* ===== 木鱼敲击区域 ===== */
        .wooden-fish-section {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            animation: fadeIn 0.4s ease;
        }

        .wooden-fish-section.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .current-target-name {
            font-size: 1.2rem;
            color: #d4a853;
            margin-bottom: 8px;
        }

        .current-karma-display {
            font-size: 3rem;
            font-weight: bold;
            color: #d4a853;
            margin-bottom: 24px;
            text-shadow: 0 0 30px rgba(212, 168, 83, 0.4);
            transition: transform 0.15s ease;
        }

        .current-karma-display.pop {
            animation: bigPop 0.3s ease;
        }

        @keyframes bigPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 木鱼按钮 */
        .wooden-fish-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid #d4a853;
            background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(212, 168, 83, 0.1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .wooden-fish-btn:hover {
            box-shadow: 0 8px 30px rgba(212, 168, 83, 0.25), inset 0 2px 10px rgba(212, 168, 83, 0.15);
        }

        .wooden-fish-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 震动效果 */
        .wooden-fish-btn.shake {
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-6px) rotate(-3deg); }
            40% { transform: translateX(6px) rotate(3deg); }
            60% { transform: translateX(-4px) rotate(-2deg); }
            80% { transform: translateX(4px) rotate(2deg); }
        }

        /* 木鱼涟漪效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(212, 168, 83, 0.6);
            animation: rippleEffect 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* 飘升文字效果 */
        .float-text {
            position: absolute;
            color: #d4a853;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.3);
            }
        }

        /* 敲击提示 */
        .tap-hint {
            margin-top: 16px;
            color: #5a5a7a;
            font-size: 0.85rem;
        }

        /* ===== 底部统计 ===== */
        .footer-stats {
            text-align: center;
            padding: 16px 16px 6px;
            color: #5a5a7a;
            font-size: 0.8rem;
        }

        /* ===== 版权信息 ===== */
        .copyright {
            text-align: center;
            padding: 6px 16px 20px;
            color: #4a4a6a;
            font-size: 0.72rem;
        }

        .copyright a {
            color: #8b7355;
            text-decoration: none;
            transition: color 0.2s;
        }

        .copyright a:hover {
            color: #d4a853;
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .target-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .wooden-fish-btn {
                width: 140px;
                height: 140px;
                font-size: 3.5rem;
            }

            .current-karma-display {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 页面标题 -->
    <div class="header">
        <h1>反向木鱼</h1>
        <div class="subtitle">电子积德，赛博回向</div>
    </div>

    <!-- 添加制裁对象 -->
    <div class="add-section">
        <input type="text" id="targetInput" placeholder="输入讨厌的人（如：老板）" maxlength="12">
        <button id="addBtn">添加靶子</button>
    </div>

    <!-- 制裁对象列表 -->
    <div class="target-list" id="targetList"></div>

    <!-- 木鱼敲击区域 -->
    <div class="wooden-fish-section" id="fishSection">
        <div class="current-target-name" id="currentTargetName"></div>
        <div class="current-karma-display" id="currentKarma">0</div>
        <div class="wooden-fish-btn" id="woodenFish">🪘</div>
        <div class="tap-hint">点击木鱼，为TA积累业力</div>
    </div>

    <!-- 木鱼敲击音效（预加载，避免首次点击延迟） -->
    <audio id="muyuSound" src="media/muyu.mp3" preload="auto"></audio>

    <!-- 底部统计 -->
    <div class="footer-stats" id="footerStats"></div>

    <!-- 版权信息 -->
    <div class="copyright">© 2026 <a href="https://pass.junjunloveprogramming.cn" target="_blank">骏骏爱编程</a> 保留所有权利</div>

    <script>
        // ===== 数据存储管理 =====
        const STORAGE_KEY = 'reverse_wooden_fish_data';

        /**
         * 从 localStorage 读取数据
         * @returns {Object} 包含 targets 数组和 lastActiveId 的对象
         */
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    return JSON.parse(raw);
                }
            } catch (e) {
                console.error('读取本地数据失败:', e);
            }
            return { targets: [], lastActiveId: null };
        }

        /**
         * 将数据保存到 localStorage
         * @param {Object} data - 要保存的数据对象
         */
        function saveData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('保存本地数据失败:', e);
            }
        }

        // ===== 应用状态 =====
        let appData = loadData();
        let currentTargetId = appData.lastActiveId;

        // ===== DOM 元素引用 =====
        const targetInput = document.getElementById('targetInput');
        const addBtn = document.getElementById('addBtn');
        const targetList = document.getElementById('targetList');
        const fishSection = document.getElementById('fishSection');
        const currentTargetName = document.getElementById('currentTargetName');
        const currentKarma = document.getElementById('currentKarma');
        const woodenFish = document.getElementById('woodenFish');
        const muyuSound = document.getElementById('muyuSound');
        const footerStats = document.getElementById('footerStats');

        // ===== 核心功能函数 =====

        /**
         * 生成唯一 ID
         * @returns {string} 时间戳+随机数构成的 ID
         */
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        /**
         * 添加新的制裁对象
         */
        function addTarget() {
            const name = targetInput.value.trim();
            if (!name) {
                targetInput.focus();
                return;
            }

            // 检查是否已存在同名对象
            const exists = appData.targets.some(t => t.name === name);
            if (exists) {
                alert('该靶子已存在！');
                return;
            }

            const newTarget = {
                id: generateId(),
                name: name,
                karma: 0,
                createdAt: Date.now()
            };

            appData.targets.push(newTarget);
            saveData(appData);
            targetInput.value = '';
            renderTargetList();

            // 自动选中新添加的对象
            selectTarget(newTarget.id);
        }

        /**
         * 删除制裁对象
         * @param {string} id - 要删除的对象 ID
         * @param {Event} event - 点击事件，用于阻止冒泡
         */
        function deleteTarget(id, event) {
            event.stopPropagation();
            if (!confirm('确定要删除这个靶子吗？')) {
                return;
            }

            appData.targets = appData.targets.filter(t => t.id !== id);

            // 如果删除的是当前选中的对象，清空当前选中状态
            if (currentTargetId === id) {
                currentTargetId = null;
                appData.lastActiveId = null;
                fishSection.classList.remove('visible');
            }

            saveData(appData);
            renderTargetList();
            updateFooterStats();
        }

        /**
         * 选中某个制裁对象
         * @param {string} id - 要选中的对象 ID
         */
        function selectTarget(id) {
            currentTargetId = id;
            appData.lastActiveId = id;
            saveData(appData);
            renderTargetList();
            renderFishSection();
        }

        /**
         * 敲击木鱼，增加业力值
         */
        function tapWoodenFish() {
            if (!currentTargetId) return;

            const target = appData.targets.find(t => t.id === currentTargetId);
            if (!target) return;

            // 增加业力值
            target.karma += 1;
            saveData(appData);

            // 更新 UI 显示
            renderTargetList();
            updateCurrentKarmaDisplay();
            updateFooterStats();

            // 触发震动和数字跳动反馈
            triggerFeedback();
        }

        /**
         * 触发敲击反馈效果（音效 + 震动 + 数字跳动 + 涟漪 + 飘字）
         */
        function triggerFeedback() {
            // 播放木鱼音效（重置到开头，支持快速连点）
            try {
                muyuSound.currentTime = 0;
                const playPromise = muyuSound.play();
                // 处理浏览器自动播放策略可能导致的拒绝
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        // 静默处理：等待后续用户交互再播放
                    });
                }
            } catch (e) {
                console.error('播放音效失败:', e);
            }

            // 木鱼震动
            woodenFish.classList.remove('shake');
            void woodenFish.offsetWidth; // 强制重绘
            woodenFish.classList.add('shake');

            // 大数字跳动
            currentKarma.classList.remove('pop');
            void currentKarma.offsetWidth;
            currentKarma.classList.add('pop');

            // 创建涟漪效果
            createRipple();

            // 创建飘升文字
            createFloatText();
        }

        /**
         * 在木鱼按钮上创建涟漪扩散效果
         */
        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const rect = woodenFish.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            ripple.style.left = centerX + 'px';
            ripple.style.top = centerY + 'px';
            woodenFish.appendChild(ripple);

            // 动画结束后移除元素
            setTimeout(() => ripple.remove(), 600);
        }

        /**
         * 创建飘升的文字效果
         */
        function createFloatText() {
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.textContent = '业力 +1';
            const rect = woodenFish.getBoundingClientRect();
            floatText.style.left = (rect.width / 2 - 20) + 'px';
            floatText.style.top = (rect.height / 2 - 30) + 'px';
            woodenFish.appendChild(floatText);

            setTimeout(() => floatText.remove(), 800);
        }

        // ===== 渲染函数 =====

        /**
         * 渲染制裁对象列表
         */
        function renderTargetList() {
            if (appData.targets.length === 0) {
                targetList.innerHTML = '<div class="empty-tip">还没有靶子，快添加一个吧 👆</div>';
                return;
            }

            targetList.innerHTML = '';

            // 按业力值降序排列
            const sortedTargets = [...appData.targets].sort((a, b) => b.karma - a.karma);

            sortedTargets.forEach(target => {
                const card = document.createElement('div');
                card.className = 'target-card' + (target.id === currentTargetId ? ' active' : '');
                card.onclick = () => selectTarget(target.id);

                const karmaClass = target.karma > 0 ? 'karma-value pop' : 'karma-value';

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteTarget('${target.id}', event)">×</button>
                    <div class="target-name">${escapeHtml(target.name)}</div>
                    <div class="${karmaClass}" data-id="${target.id}">${target.karma}</div>
                    <div class="karma-label">业力值</div>
                `;

                targetList.appendChild(card);
            });
        }

        /**
         * 渲染木鱼敲击区域
         */
        function renderFishSection() {
            if (!currentTargetId) {
                fishSection.classList.remove('visible');
                return;
            }

            const target = appData.targets.find(t => t.id === currentTargetId);
            if (!target) {
                fishSection.classList.remove('visible');
                return;
            }

            currentTargetName.textContent = `正在为「${target.name}」积累业力`;
            currentKarma.textContent = target.karma;
            fishSection.classList.add('visible');
        }

        /**
         * 更新当前选中对象的业力值显示
         */
        function updateCurrentKarmaDisplay() {
            const target = appData.targets.find(t => t.id === currentTargetId);
            if (target) {
                currentKarma.textContent = target.karma;
            }
        }

        /**
         * 更新底部统计信息
         */
        function updateFooterStats() {
            const totalTargets = appData.targets.length;
            const totalKarma = appData.targets.reduce((sum, t) => sum + t.karma, 0);

            if (totalTargets === 0) {
                footerStats.textContent = '';
                return;
            }

            footerStats.textContent = `共 ${totalTargets} 个靶子 · 累计业力 ${totalKarma}`;
        }

        /**
         * HTML 转义，防止 XSS
         * @param {string} text - 原始文本
         * @returns {string} 转义后的安全文本
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 事件绑定 =====

        // 添加按钮点击
        addBtn.addEventListener('click', addTarget);

        // 输入框回车提交
        targetInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTarget();
            }
        });

        // 木鱼点击/触摸
        woodenFish.addEventListener('click', tapWoodenFish);

        // 支持触摸设备的快速连点
        woodenFish.addEventListener('touchstart', (e) => {
            e.preventDefault();
            tapWoodenFish();
        }, { passive: false });

        // ===== 初始化 =====
        renderTargetList();
        updateFooterStats();
        if (currentTargetId) {
            renderFishSection();
        }
    </script>
</body>
</html>
